name: Validate data

on:
  push:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - 'assets/js/**'
      - 'package*.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - 'assets/js/**'
      - 'package*.json'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install js-yaml ajv ajv-formats marked
      - name: Run regression checks
        run: |
          node scripts/lib/catalog.test.js
          node scripts/lib/canonical-url.test.js
          node scripts/lib/quality-score.test.js
          node scripts/lib/entry-schema.test.js
          node scripts/lib/review-regressions.test.js
          node scripts/lib/escaping.test.js
      - name: Validate schema + vocab + duplicates
        run: node scripts/validate.js
      - name: Dry-render README to ensure generator works
        run: node scripts/render.js > /tmp/regen-README.md
      - name: Export JSON index
        run: node scripts/export-data.js /tmp/data.json

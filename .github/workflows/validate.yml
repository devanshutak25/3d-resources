name: Validate data

on:
  push:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - 'assets/**'
      - 'build.sh'
      - 'package*.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - 'assets/**'
      - 'build.sh'
      - 'package*.json'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + regression tests
        run: npm test
      - name: Validate schema + vocab + duplicates
        run: node scripts/validate.js
      # Full site build (README render, pages, feeds, sitemap) ending in
      # check-built-links.js, so template or link breakage fails here, not on deploy.
      - name: Build site
        run: bash build.sh
      # README.md is derived from data/. PRs only touch data/, so a stale README is
      # a notice here; render-readme.yml regenerates it after merge to main.
      - name: README freshness
        run: |
          git diff --quiet -- README.md && echo "README.md up to date." \
            || echo "::notice::README.md differs from a fresh render; render-readme.yml will update it on main."

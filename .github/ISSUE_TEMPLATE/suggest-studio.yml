name: Suggest a studio
description: Add an animation, VFX, motion design, CG, arch viz or other studio to /studios/, or a game developer to /game-studios/.
title: "[Studio] <Studio name>"
labels: ["studio", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Studios live in `data/studios/` (schema: `schema/studio.schema.json`), game developers in `data/game-studios/` (schema: `schema/game-studio.schema.json`). A pull request is fastest (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)). Otherwise fill this out. Active studios only.
  - type: input
    id: name
    attributes:
      label: Studio name
      placeholder: "e.g. Framestore"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: HQ city and country
      placeholder: "e.g. London, United Kingdom"
    validations:
      required: true
  - type: dropdown
    id: directory
    attributes:
      label: Directory
      options:
        - Studios (/studios/)
        - Game studios (/game-studios/)
    validations:
      required: true
  - type: dropdown
    id: segments
    attributes:
      label: Segment (game studios only)
      multiple: true
      options:
        - AAA
        - AA
        - Indie
        - Mobile
        - Co-dev / porting
        - VR / XR
        - UGC (Roblox, UEFN)
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms (game studios only)
      multiple: true
      options:
        - PC
        - Console
        - Mobile
        - VR
        - Web
  - type: dropdown
    id: disciplines
    attributes:
      label: Disciplines (studios directory only)
      multiple: true
      options:
        - 2D animation
        - 3D animation
        - Stop motion
        - Motion design
        - Title design
        - VFX
        - Previs
        - Virtual production
        - Live action
        - CG / 3D
        - Product viz
        - Arch viz
        - Game cinematics
        - Outsourcing
        - Mocap
        - XR / interactive
        - Experiential
  - type: dropdown
    id: markets
    attributes:
      label: Works for (studios directory, optional)
      multiple: true
      options:
        - Film
        - Episodic
        - Advertising
        - Music video
        - Games
        - Brand
  - type: dropdown
    id: size
    attributes:
      label: Size (optional, LinkedIn company size)
      options:
        - 1-10 people
        - 11-50 people
        - 51-200 people
        - 201+ people
  - type: input
    id: founded
    attributes:
      label: Year founded (optional)
      placeholder: "e.g. 1986"
  - type: input
    id: careers
    attributes:
      label: Careers page (optional)
      placeholder: "https://..."
  - type: textarea
    id: extra
    attributes:
      label: Notable work or games, parent company, other offices, socials (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched /studios/ and /game-studios/ and this studio isn't listed.
          required: true
